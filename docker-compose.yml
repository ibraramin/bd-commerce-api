services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bd-commerce-api:local
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "${ConnectionStrings__Default:-Host=postgres;Port=5432;Database=bdcommerce;Username=postgres;Password=postgres}"
      Payment__Provider: "${Payment__Provider:-Mock}"
      # Development fallback only. Set a real secret in deployed environments.
      Payment__WebhookSecret: "${Payment__WebhookSecret:-local-dev-secret-change-me}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-bdcommerce}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bdcommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
